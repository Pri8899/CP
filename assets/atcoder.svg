<svg xmlns="http://www.w3.org/2000/svg" width="200" height="270" viewBox="0 0 200 270" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="card-bg-ac" x1="0" y1="0" x2="200" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Radial Ambient Glow -->
    <radialGradient id="card-glow-ac" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.25">
        <animate attributeName="stop-opacity" values="0.15; 0.35; 0.15" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="270" rx="16" fill="url(#card-bg-ac)" stroke="#30363d" stroke-width="1.5" />
  <rect width="200" height="270" rx="16" fill="url(#card-glow-ac)" />

  <!-- Top Laser Beam Accent -->
  <line x1="24" y1="1" x2="176" y2="1" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round">
    <animate attributeName="opacity" values="0.45; 1; 0.45" dur="2.8s" repeatCount="indefinite" />
  </line>

  <!-- Center Icon Frame -->
  <g transform="translate(70, 26)">
    <rect width="60" height="60" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1" />
    
      <path d="M 30 14 L 14 44 L 21 44 L 25 36 L 35 36 L 39 44 L 46 44 Z M 27 30 L 30 22 L 33 30 Z" fill="#ffffff" />
    
  </g>

  <!-- Platform Title & Handle -->
  <text x="100" y="112" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">AtCoder</text>
  <text x="100" y="130" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#8b949e">@Pri8899</text>

  <!-- Solution Count -->
  <text x="100" y="176" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">0</text>
  <text x="100" y="193" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#8b949e" letter-spacing="1.5">SOLUTIONS</text>

  <!-- Bottom Badge / Extra Info -->
  <text x="100" y="232" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">View profile →</text>
</svg>