<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 270" width="200" height="270" role="img" aria-label="AtCoder profile">
  <defs>
    <!-- Card Clip Path -->
    <clipPath id="card-clip-ac">
      <rect width="200" height="270" rx="18" />
    </clipPath>

    <!-- Top Laser Shimmer Beam -->
    <linearGradient id="laser-ac" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#e2e8f0" stop-opacity="1" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
      <animate attributeName="x1" values="-150%; 150%" dur="3.2s" repeatCount="indefinite" />
      <animate attributeName="x2" values="-50%; 250%" dur="3.2s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Top Accent Bar -->
    <linearGradient id="top-bar-ac" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#e2e8f0" stop-opacity="1" />
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.6" />
    </linearGradient>

    <!-- Icon Halo Glow (No dark shade) -->
    <radialGradient id="glow-ac" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.25">
        <animate attributeName="stop-opacity" values="0.15; 0.35; 0.15" dur="2.8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Card Background -->
  <rect width="200" height="270" rx="18" fill="#0d1117" />
  <rect width="200" height="270" rx="18" fill="#161b22" fill-opacity="0.35" />

  <!-- Animated Glowing Outer Border -->
  <rect x="0.5" y="0.5" width="199" height="269" rx="18" fill="none" stroke="#e2e8f0" stroke-width="1.2" stroke-opacity="0.35">
    <animate attributeName="stroke-opacity" values="0.2; 0.55; 0.2" dur="3s" repeatCount="indefinite" />
  </rect>

  <!-- Top Curved Accent Bar with Perpetual Laser Sweep -->
  <g clip-path="url(#card-clip-ac)">
    <rect width="200" height="4.5" fill="url(#top-bar-ac)" />
    <rect width="200" height="4.5" fill="url(#laser-ac)" />
  </g>

  <!-- Center Icon Frame with Halo Glow (Pure vector transparency, ZERO square sticker) -->
  <circle cx="100" cy="62" r="38" fill="url(#glow-ac)" />
  <rect x="68" y="30" width="64" height="64" rx="18" fill="#e2e8f0" fill-opacity="0.12" stroke="#e2e8f0" stroke-opacity="0.4" stroke-width="1.2">
    <animate attributeName="stroke-opacity" values="0.3; 0.65; 0.3" dur="2.5s" repeatCount="indefinite" />
  </rect>
  
    <g transform="translate(100, 62)">
      <polyline points="-14,14 0,-14 14,14" fill="none" stroke="#e2e8f0" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="-7" y1="4" x2="7" y2="4" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
    </g>

  <!-- Platform Name & Handle -->
  <text x="100" y="132" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18.5" font-weight="700" fill="#f0f6fc">AtCoder</text>
  <text x="100" y="153" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8b949e">@-</text>

  <!-- Divider -->
  <line x1="36" y1="173" x2="164" y2="173" stroke="#21262d" />

  <!-- Solved Count & Label -->
  <text x="100" y="209" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#f0f6fc">0</text>
  <text x="100" y="228" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#8b949e">SOLUTIONS</text>

  <!-- Bottom Badge with Pulse Animation -->
  <g transform="translate(100, 254)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#6e7681">
      Not Synced
      
    </text>
  </g>
</svg>