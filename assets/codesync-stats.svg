<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="495" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <linearGradient id="border-flow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb">
        <animate attributeName="stop-color" values="#1f6feb; #58a6ff; #3fb950; #1f6feb" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="35%" stop-color="#30363d">
        <animate attributeName="stop-color" values="#30363d; #1f6feb; #30363d; #30363d" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="70%" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff; #3fb950; #1f6feb; #58a6ff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#30363d">
        <animate attributeName="stop-color" values="#30363d; #30363d; #58a6ff; #30363d" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="aurora" cx="80%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.14">
        <animate attributeName="stop-opacity" values="0.06; 0.22; 0.06" dur="3.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="icon-grad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1f6feb">
        <animate attributeName="stop-color" values="#1f6feb; #58a6ff; #388bfd; #1f6feb" dur="2.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff; #79c0ff; #1f6feb; #58a6ff" dur="2.5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="streak-flame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0883e">
        <animate attributeName="stop-color" values="#f0883e; #ff7b72; #f97316; #f0883e" dur="2.2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#f97316">
        <animate attributeName="stop-color" values="#f97316; #f0883e; #ff7b72; #f97316" dur="2.2s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="laser-sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#58a6ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-150%; 150%" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-50%; 250%" dur="2.4s" repeatCount="indefinite"/>
    </linearGradient>

    <clipPath id="bar-clip">
      <rect x="24" y="118" width="447" height="7" rx="3.5"/>
    </clipPath>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #e6edf3; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-size: 11px; fill: #8b949e; }
    .stat-val { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-weight: 800; }
    .stat-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-size: 9.5px; font-weight: 600; fill: #8b949e; letter-spacing: 0.5px; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; fill: #3fb950; }
  </style>

  <rect width="495" height="195" rx="12" fill="url(#bg)"/>
  <rect width="495" height="195" rx="12" fill="url(#aurora)"/>
  <rect x="0.5" y="0.5" width="494" height="194" rx="12" fill="none" stroke="url(#border-flow)" stroke-width="1.2"/>

  <!-- Header -->
  <g transform="translate(24, 20)">
    <g transform="translate(0, 2)">
      <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" fill="url(#icon-grad)" filter="url(#glow)"/>
      <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" fill="#ffffff" opacity="0.4"/>
    </g>
    <text x="32" y="16" class="title">CodeSync Pro Workstation</text>
    <text x="32" y="31" class="subtitle">@Pri8899 · Competitive Programming Portfolio</text>
  </g>

  <!-- Live Pulse Badge -->
  <g transform="translate(385, 23)">
    <rect width="86" height="20" rx="10" fill="#1b2e23" stroke="#238636" stroke-width="0.8"/>
    <circle cx="10" cy="10" r="3.5" fill="#3fb950">
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="10" cy="10" r="6" fill="#3fb950" opacity="0.3">
      <animate attributeName="r" values="3.5; 8; 3.5" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4; 0; 0.4" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="20" y="14" class="badge-txt">AUTO-SYNC</text>
  </g>

  <!-- Metrics Grid -->
  <g transform="translate(24, 68)">
    <g>
      <text x="0" y="20" class="stat-val" font-size="22" fill="#58a6ff">148</text>
      <text x="0" y="34" class="stat-lbl">TOTAL SOLVED</text>
    </g>
    <g>
      <text x="120" y="20" class="stat-val" font-size="22" fill="url(#streak-flame)">46<tspan font-size="13" font-weight="500" fill="#8b949e"> days</tspan></text>
      <text x="120" y="34" class="stat-lbl">CURRENT STREAK</text>
    </g>
    <g>
      <text x="245" y="20" class="stat-val" font-size="22" fill="#3fb950">60.3%</text>
      <text x="245" y="34" class="stat-lbl">AC ACCURACY</text>
    </g>
    <g>
      <text x="360" y="20" class="stat-val" font-size="22" fill="#c9d1d9">209</text>
      <text x="360" y="34" class="stat-lbl">SUBMISSIONS</text>
    </g>
  </g>

  <!-- Progress Bar Container -->
  <rect x="24" y="118" width="447" height="7" rx="3.5" fill="#21262d"/>
  <g clip-path="url(#bar-clip)">
    <rect x="24" y="118" width="380.55405405405406" height="7" fill="#58a6ff"/><rect x="404.55405405405406" y="118" width="18.12162162162162" height="7" fill="#3fb950"/><rect x="422.6756756756757" y="118" width="48.32432432432433" height="7" fill="#f0883e"/>
    <rect x="24" y="118" width="447" height="7" fill="url(#laser-sweep)"/>
  </g>

  <!-- Platform Pills -->
  
    <g transform="translate(24, 137)">
      <rect width="143" height="24" rx="12" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
      <circle cx="11" cy="12" r="3.5" fill="#58a6ff">
        <animate attributeName="opacity" values="0.75; 1; 0.75" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="21" y="17" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#8b949e">CF</text>
      <text x="134" y="17" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#e6edf3">126</text>
    </g>
    <g transform="translate(175, 137)">
      <rect width="143" height="24" rx="12" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
      <circle cx="11" cy="12" r="3.5" fill="#3fb950">
        <animate attributeName="opacity" values="0.75; 1; 0.75" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="21" y="17" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#8b949e">CSES</text>
      <text x="134" y="17" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#e6edf3">6</text>
    </g>
    <g transform="translate(326, 137)">
      <rect width="143" height="24" rx="12" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
      <circle cx="11" cy="12" r="3.5" fill="#f0883e">
        <animate attributeName="opacity" values="0.75; 1; 0.75" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="21" y="17" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#8b949e">LC</text>
      <text x="134" y="17" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#e6edf3">16</text>
    </g>

  <!-- Footer Subtle Info -->
  <g transform="translate(24, 180)">
    <path d="M6 1L1 7h4l-0.5 4L9 5H5.5L6 1z" fill="#58a6ff" transform="scale(0.8) translate(0, -1)"/>
    <text x="12" y="8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="9" fill="#484f58">Auto-generated by CodeSync Pro</text>
    <text x="447" y="8" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="9" fill="#484f58">Live Synchronized</text>
  </g>
</svg>