<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 270" width="200" height="270" role="img" aria-label="Codeforces profile">
  <defs>
    <clipPath id="c-cf">
      <rect width="200" height="270" rx="18" />
    </clipPath>
    <radialGradient id="g-cf" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.32">
        <animate attributeName="stop-opacity" values="0.22; 0.42; 0.22" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Card Background -->
  <rect width="200" height="270" rx="18" fill="#0d1117" />

  <!-- Top Accent Bar (Curved with Border) & Subtle Radial Glow -->
  <g clip-path="url(#c-cf)">
    <rect width="200" height="150" fill="url(#g-cf)" />
    <rect width="200" height="4" fill="#3b82f6" />
  </g>

  <!-- Card Border -->
  <rect x="0.5" y="0.5" width="199" height="269" rx="18" fill="none" stroke="#30363d" stroke-width="1" />

  <!-- Center Icon Frame with Real Logo -->
  <rect x="68" y="30" width="64" height="64" rx="18" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-opacity="0.45" />
  <image x="74" y="36" width="52" height="52" preserveAspectRatio="xMidYMid meet" href="data:image/png;base64," xlink:href="data:image/png;base64," />

  <!-- Platform Name & Handle -->
  <text x="100" y="132" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#f0f6fc">Codeforces</text>
  <text x="100" y="153" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8b949e">@Pri8899</text>

  <!-- Divider -->
  <line x1="36" y1="173" x2="164" y2="173" stroke="#21262d" />

  <!-- Solved Count & Label -->
  <text x="100" y="209" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#f0f6fc">126</text>
  <text x="100" y="228" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#8b949e">SOLUTIONS</text>

  <!-- Bottom Badge / Link Action -->
  <text x="100" y="254" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#3b82f6">View profile →</text>
</svg>